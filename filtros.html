<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filtros — Repuestos Obsoletos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="back-link">← Volver</a>
      <div class="logo">
        <span class="logo-main">REPUESTOS</span>
        <span class="logo-sub">OBSOLETOS</span>
      </div>
      <div class="header-tagline">Stock disponible · Precios reales · Envíos a todo el país</div>
    </div>
  </header>

  <main>
    <section class="catalog-header">
      <div class="catalog-header-inner">
        <div>
          <div class="breadcrumb">Inicio / <strong>Filtros</strong></div>
          <h1 class="catalog-title">FILTROS</h1>
          <p class="catalog-subtitle" id="catalog-stats">Cargando catálogo...</p>
        </div>
        <div class="search-wrap">
          <input type="text" id="search-input" class="search-input" placeholder="Buscar por código o aplicabilidad..." />
        </div>
      </div>
    </section>

    <section class="catalog-section">
      <div class="products-grid" id="products-grid">
        <!-- Cargado dinámicamente -->
      </div>
      <div class="no-results hidden" id="no-results">
        No se encontraron repuestos para esa búsqueda.
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2025 Repuestos Obsoletos</span>
      <span>Mendoza, Argentina</span>
    </div>
  </footer>

  <!-- Modal de producto -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script>
    const WHATSAPP_NUMBER = '549261670908'; // ← REEMPLAZAR con número real

    let allProducts = [];

    function formatPrice(n) {
      return '$ ' + n.toLocaleString('es-AR');
    }

    // Prueba webp → jpg → "Sin foto"
    function tryNextFormat(img) {
      const src = img.src;
      const sinFoto = img.dataset.sinFoto;
      if (src.endsWith('.webp')) {
        img.onerror = function() { tryNextFormat(this); };
        img.src = src.replace('.webp', '.jpg');
      } else {
        img.onerror = null;
        img.parentElement.innerHTML = '<div class="' + sinFoto + '">Sin foto</div>';
      }
    }

    function imgConFallback(codigo, cssClass) {
      const sinFoto = cssClass === 'product-img' ? 'no-img' : 'modal-no-img';
      const base = 'img/filtros/' + codigo.toUpperCase();
      return `<img src="${base}.webp" alt="${codigo}" class="${cssClass}" data-sin-foto="${sinFoto}" onerror="tryNextFormat(this)" />`;
    }

    function buildCard(item) {
      return `
        <div class="product-card" data-codigo="${item.codigo}" data-aplicabilidad="${item.aplicabilidad.toLowerCase()}">
          <div class="product-img-wrap">
            ${imgConFallback(item.codigo, 'product-img')}
            <div class="product-stock ${item.cantidad <= 3 ? 'low' : ''}">
              ${item.cantidad <= 3 ? '⚠ Últimas ' : ''}${item.cantidad} u.
            </div>
          </div>
          <div class="product-body">
            <div class="product-code">${item.codigo}</div>
            <div class="product-desc">${item.descripcion}</div>
            <div class="product-aplicabilidad">${item.aplicabilidad}</div>
            <div class="product-footer">
              <div class="product-price">${formatPrice(item.precio)}</div>
              <button class="btn-consult" onclick="openModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                Consultar
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      const noResults = document.getElementById('no-results');
      if (list.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
      } else {
        noResults.classList.add('hidden');
        grid.innerHTML = list.map(buildCard).join('');
      }
    }

    function openModal(item) {
      const waMsg = encodeURIComponent(
        `Hola, estoy interesado en el repuesto *${item.codigo}* (${item.aplicabilidad}). ¿Está disponible?`
      );
      const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`;

      document.getElementById('modal-content').innerHTML = `
        <div class="modal-img-wrap">
          ${imgConFallback(item.codigo, 'modal-img')}
        </div>
        <div class="modal-info">
          <div class="modal-code">${item.codigo}</div>
          <div class="modal-desc">${item.descripcion}</div>
          <div class="modal-aplicabilidad">${item.aplicabilidad}</div>
          <div class="modal-row">
            <span class="modal-label">Precio unitario</span>
            <span class="modal-value price">${formatPrice(item.precio)}</span>
          </div>
          <div class="modal-row">
            <span class="modal-label">Stock disponible</span>
            <span class="modal-value ${item.cantidad <= 3 ? 'low-stock' : ''}">${item.cantidad} unidades</span>
          </div>
          <a href="${waLink}" target="_blank" class="btn-whatsapp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            Consultar por WhatsApp
          </a>
        </div>
      `;
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.body.style.overflow = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allProducts.filter(item =>
        item.codigo.toLowerCase().includes(q) ||
        item.aplicabilidad.toLowerCase().includes(q)
      );
      renderProducts(filtered);
    });

    // Cargar datos
    fetch('data/filtros.json')
      .then(r => r.json())
      .then(data => {
        allProducts = data;
        const total = data.reduce((acc, i) => acc + i.cantidad, 0);
        document.getElementById('catalog-stats').textContent =
          `${data.length} referencias · ${total} unidades en stock`;
        renderProducts(data);
      })
      .catch(() => {
        document.getElementById('catalog-stats').textContent = 'Error al cargar el catálogo';
      });
  </script>
</body>
</html>
